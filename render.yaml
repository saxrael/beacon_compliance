services:
  - type: web
    name: beacon-compliance-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install uv && uv pip install backend/ --system
    startCommand: uvicorn backend.src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CHARITY_NUMBER
        value: SC054652
      - key: AES_256_GCM_SECRET
        sync: false
      - key: TRUSTEE_SIGNATURE_SALT
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
