name: Beacon Compliance CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: Test & Pre-Flight Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Linter
        run: ruff check backend scripts

      - name: Run Pre-Flight Deployment Audit
        run: python scripts/deploy_check.py
        env:
          AES_256_GCM_SECRET: "test_secret_32_bytes_long_high_entropy_beacon_2026"

      - name: Run Pytest Test Suite
        run: python -m pytest backend/tests -v
        env:
          AES_256_GCM_SECRET: "test_secret_32_bytes_long_high_entropy_beacon_2026"

  frontend-audit:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && (npm ci || npm install)

      - name: Run Frontend Type Check & Build
        run: cd frontend && npm run build

  migrate-database:
    name: Cloudflare D1 Automated Database Migration
    needs: test-and-audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply Cloudflare D1 Idempotent Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply beacon-compliance-d1 --remote

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [test-and-audit, frontend-audit, migrate-database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

  deploy-backend:
    name: Deploy Backend Docker Container to OCI
    needs: [test-and-audit, migrate-database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beacon-compliance-backend:latest
            ghcr.io/${{ github.repository_owner }}/beacon-compliance-backend:${{ github.sha }}

      - name: Deploy to OCI VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || '22' }}
          command_timeout: "30m"
          script_stop: true
          script: |
            set -e
            echo "==> [1/5] Setting up project directory and configuration..."
            mkdir -p ~/beacon_compliance
            cat > ~/beacon_compliance/.env <<'EOF'
            APP_ENV=production
            LOG_LEVEL=INFO
            CHARITY_NUMBER=SC054652
            CHARITY_NAME=Potter's House Christian Mission UK
            AES_256_GCM_SECRET=${{ secrets.AES_256_GCM_SECRET }}
            TRUSTEE_SIGNATURE_SALT=${{ secrets.TRUSTEE_SIGNATURE_SALT }}
            ADMIN_PROVISION_SECRET=${{ secrets.ADMIN_PROVISION_SECRET }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_D1_DATABASE_ID=${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
            CLOUDFLARE_R2_BUCKET_NAME=${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_USE_TLS=${{ secrets.SMTP_USE_TLS }}
            NOTIFICATION_FROM_EMAIL=${{ secrets.NOTIFICATION_FROM_EMAIL }}
            LANGFUSE_ENABLED=${{ secrets.LANGFUSE_ENABLED }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}
            EOF

            cat > ~/beacon_compliance/docker-compose.yml <<'EOF'
            services:
              beacon-backend:
                image: ghcr.io/${{ github.repository_owner }}/beacon-compliance-backend:latest
                container_name: beacon-compliance-backend
                restart: always
                ports:
                  - "8000:8000"
                env_file:
                  - .env
                environment:
                  - APP_ENV=production
                  - PORT=8000
                  - D1_DB_PATH=/app/data/beacon_compliance.db
                  - PYTHONUNBUFFERED=1
                  - MALLOC_ARENA_MAX=2
                deploy:
                  resources:
                    limits:
                      memory: 650M
                volumes:
                  - ./data:/app/data
                healthcheck:
                  test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            EOF

            echo "==> [2/5] Preparing system tuning and Docker storage driver..."
            sudo -n sysctl -w vm.swappiness=10 2>/dev/null || true
            sudo -n mkdir -p /etc/docker
            sudo -n tee /etc/docker/daemon.json >/dev/null <<'EOF_DAEMON'
{
  "features": {
    "containerd-snapshotter": false
  },
  "max-concurrent-downloads": 3,
  "max-concurrent-uploads": 1,
  "log-driver": "json-file",
  "log-opts": {
    "max-size": "20m",
    "max-file": "3"
  }
}
EOF_DAEMON
            sudo -n systemctl restart docker 2>/dev/null || true
            cd ~/beacon_compliance
            mkdir -p ~/beacon_compliance/data
            sudo -n chmod -R 777 ~/beacon_compliance/data 2>/dev/null || chmod -R 777 ~/beacon_compliance/data 2>/dev/null || true
            sudo -n chown -R 1001:1001 ~/beacon_compliance/data 2>/dev/null || true

            echo "==> [3/5] Authenticating Docker with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            echo "==> [4/5] Pulling latest production container..."
            docker pull ghcr.io/${{ github.repository_owner }}/beacon-compliance-backend:latest

            echo "==> [5/5] Recreating and launching container in background..."
            docker stop beacon-compliance-backend 2>/dev/null || true
            docker rm -f beacon-compliance-backend 2>/dev/null || true
            docker run -d \
              --name beacon-compliance-backend \
              --restart always \
              -p 8000:8000 \
              --env-file ~/beacon_compliance/.env \
              -e APP_ENV=production \
              -e PORT=8000 \
              -e D1_DB_PATH=/app/data/beacon_compliance.db \
              -e PYTHONUNBUFFERED=1 \
              -e MALLOC_ARENA_MAX=2 \
              --memory 650m \
              -v ~/beacon_compliance/data:/app/data \
              ghcr.io/${{ github.repository_owner }}/beacon-compliance-backend:latest

            if [ -n "${{ secrets.DUCKDNS_DOMAIN }}" ]; then
              echo "==> [SSL] Configuring Caddy reverse proxy for ${{ secrets.DUCKDNS_DOMAIN }}..."
              printf '%s {\n    reverse_proxy localhost:8000\n    header {\n        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"\n        X-Content-Type-Options "nosniff"\n        X-Frame-Options "DENY"\n        Referrer-Policy "strict-origin-when-cross-origin"\n    }\n}\n' "${{ secrets.DUCKDNS_DOMAIN }}" > /tmp/Caddyfile
              sudo -n mv /tmp/Caddyfile /etc/caddy/Caddyfile 2>/dev/null || true
              sudo -n systemctl restart caddy --no-block 2>/dev/null || true
            fi
            echo "==> [SUCCESS] Deployment completed successfully!"

