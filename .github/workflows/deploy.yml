name: Beacon Compliance CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-audit:
    name: Test & Pre-Flight Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx fastapi uvicorn pydantic pyyaml cryptography presidio-analyzer

      - name: Run Ruff Linter
        run: ruff check backend scripts

      - name: Run Pre-Flight Deployment Audit
        run: python scripts/deploy_check.py
        env:
          AES_256_GCM_SECRET: "test_secret_32_bytes_long_high_entropy_beacon_2026"

      - name: Run Pytest Test Suite
        run: python -m pytest backend/tests -v
        env:
          AES_256_GCM_SECRET: "test_secret_32_bytes_long_high_entropy_beacon_2026"

  frontend-audit:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && (npm ci || npm install)

      - name: Run Frontend Type Check & Build
        run: cd frontend && npm run build

  migrate-database:
    name: Cloudflare D1 Automated Database Migration
    needs: test-and-audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply Cloudflare D1 Idempotent Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply beacon-compliance-d1 --remote --batch

  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [test-and-audit, frontend-audit, migrate-database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: "--prod"

  deploy-backend:
    name: Deploy Backend to Render
    needs: [test-and-audit, migrate-database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
