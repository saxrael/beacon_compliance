[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "beacon-compliance-backend"
version = "0.1.0"
description = "Agentic OSCR-compliance webapp backend for Potter's House Christian Mission UK (SCIO, SC054652)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "langgraph>=0.0.30",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "langfuse>=2.0.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "slowapi>=0.1.9",
    "email-validator>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["PLR2004", "E501", "RUF002", "PLR0913", "PLR0917", "B008", "PLW0603", "N802"]



[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", ".."]
addopts = "-v --tb=short"
