# Tier 1 Classification Ruleset (Deterministic Keyword & Regex Matching)
# Any transaction matching these rules bypasses LLM suggestions entirely.

version: "1.0"
rules:
  # Unrestricted General Fund — Receipts
  - rule_id: "RULE-REC-001"
    fund: "unrestricted_general"
    category: "Donations & Offerings"
    pattern_type: "contains"
    pattern: "OFFERING"
    transaction_type: "receipt"

  - rule_id: "RULE-REC-002"
    fund: "unrestricted_general"
    category: "Donations & Offerings"
    pattern_type: "contains"
    pattern: "TITHE"
    transaction_type: "receipt"

  - rule_id: "RULE-REC-003"
    fund: "unrestricted_general"
    category: "Gift Aid Claims"
    pattern_type: "contains"
    pattern: "HMRC GIFT AID"
    transaction_type: "receipt"

  # Unrestricted General Fund — Payments
  - rule_id: "RULE-PAY-001"
    fund: "unrestricted_general"
    category: "Premises & Rent"
    pattern_type: "contains"
    pattern: "BEACHMONT COURT RENT"
    transaction_type: "payment"

  - rule_id: "RULE-PAY-002"
    fund: "unrestricted_general"
    category: "Utilities & Insurance"
    pattern_type: "contains"
    pattern: "SCOTTISH POWER"
    transaction_type: "payment"

  - rule_id: "RULE-PAY-003"
    fund: "unrestricted_general"
    category: "Governance & Administration"
    pattern_type: "contains"
    pattern: "INDEPENDENT EXAMINER"
    transaction_type: "payment"

  # Restricted Mission Fund — Receipts & Payments
  - rule_id: "RULE-MIS-001"
    fund: "restricted_mission"
    category: "Mission Offerings"
    pattern_type: "contains"
    pattern: "MISSION DONATION"
    transaction_type: "receipt"

  - rule_id: "RULE-MIS-002"
    fund: "restricted_mission"
    category: "Missionary Support"
    pattern_type: "contains"
    pattern: "OVERSEAS MISSION SUPPORT"
    transaction_type: "payment"

  # Designated Events Fund — Receipts & Payments
  - rule_id: "RULE-EVT-001"
    fund: "designated_events"
    category: "Event Registration"
    pattern_type: "contains"
    pattern: "CONFERENCE REGISTRATION"
    transaction_type: "receipt"

  - rule_id: "RULE-EVT-002"
    fund: "designated_events"
    category: "Event Hire & Operations"
    pattern_type: "contains"
    pattern: "HALL HIRE CONFERENCE"
    transaction_type: "payment"
